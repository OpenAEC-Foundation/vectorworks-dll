[workspace]
resolver = "2"
members = [
    "crates/vwx-core",
    "crates/vwx-model",
    "crates/vwx-xt",
    "crates/vwx-read",
    "crates/vwx-ffi",
    "crates/vwx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
publish = false

[workspace.dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vwx-core = { path = "crates/vwx-core" }
vwx-model = { path = "crates/vwx-model" }
vwx-read = { path = "crates/vwx-read" }
vwx-xt = { path = "crates/vwx-xt" }

[profile.release]
lto = "thin"
