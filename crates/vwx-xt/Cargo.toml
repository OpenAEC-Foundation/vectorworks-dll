[package]
name = "vwx-xt"
description = "Reader of Parasolid XT neutral binary bodies (as embedded in Vectorworks files) and their triangulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# polygons with holes to triangles (ISC)
earcutr = "0.5"
# constrained Delaunay triangulation, for faces of curved surfaces (MIT OR Apache-2.0)
spade = "2.15"
